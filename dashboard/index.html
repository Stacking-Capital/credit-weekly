<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Weekly — Example Dashboard</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e6e8ee;
      --text: #111827;
      --muted: #6b7280;
      --faint: #9ca3af;
      --good: #15803d;
      --good-bg: #dcfce7;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --bad: #b91c1c;
      --bad-bg: #fee2e2;
      --accent: #1d4ed8;
      --accent-bg: #eff6ff;
      --ink: #111827;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 36px 20px 64px; }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
    .summary { color: var(--muted); margin: 0 0 32px; max-width: 42rem; }
    h2 { font-size: 20px; margin: 0 0 6px; }
    .section { margin: 36px 0 0; }
    .caption { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .hero {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 20px;
      margin-bottom: 16px;
    }
    .hero-num { font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; }
    .hero-meta { color: var(--muted); }
    .note { font-size: 12px; color: var(--faint); margin-top: 4px; }
    .pill {
      display: inline-flex; align-items: center;
      padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    }
    .tone-success { background: var(--good-bg); color: var(--good); }
    .tone-warning { background: var(--warn-bg); color: var(--warn); }
    .tone-danger { background: var(--bad-bg); color: var(--bad); }
    .tone-accent { background: var(--accent-bg); color: var(--accent); }
    .tone-neutral { background: #eef0f3; color: #4b5563; }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
    .seg button, .toggle {
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .seg button.on, .toggle.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 18px 16px;
    }
    .grid { display: grid; gap: 12px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card h3 { font-size: 15px; margin: 0 0 8px; }
    .card p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .chart {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 12px 8px;
    }
    .props { display: grid; gap: 6px; margin: 0; }
    .props div { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    .props dt { color: var(--muted); }
    .props dd { margin: 0; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 16px; }
    .meter .band { height: 14px; border-radius: 999px; background: #e8eaef; }
    .meter .band.on { background: var(--accent); }
    .meter .lab { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .empty { color: var(--muted); }
    @media (max-width: 720px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .hero-num { font-size: 52px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">Loading…</div>
  <script src="data.js"></script>
  <script>
    const DATA = window.CREDIT_WEEKLY_DATA;
    const app = document.getElementById("app");
    let range = "all";
    let showAll = false;
    let showReport = false;
    let reportBureau = (DATA.bureaus[1] || DATA.bureaus[0] || {}).bureau || "experian";

    const toneClass = (t) => "pill tone-" + (t || "neutral");
    const weekLabel = (w) => { const m = String(w).match(/W(\d+)$/i); return m ? "W" + m[1] : w; };

    function series() {
      const pts = DATA.history.map((h) => ({ week: h.week, label: weekLabel(h.week), value: h.credit_health_index }));
      const n = range === "4w" ? 4 : range === "12w" ? 12 : pts.length;
      return pts.slice(-Math.max(n, 1));
    }

    function spark(pts) {
      const w = 640, h = 180, pad = 28;
      const ys = pts.map((p) => p.value);
      const min = 0, max = 100;
      const x = (i) => pad + (pts.length === 1 ? (w - pad * 2) / 2 : i * (w - pad * 2) / (pts.length - 1));
      const y = (v) => pad + (1 - (v - min) / (max - min)) * (h - pad * 2);
      const d = pts.map((p, i) => (i ? "L" : "M") + x(i) + " " + y(p.value)).join(" ");
      const marks = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.value)}" r="4" fill="#1d4ed8" />
        <text x="${x(i)}" y="${h - 8}" text-anchor="middle" font-size="11" fill="#6b7280">${p.label}</text>`).join("");
      const ann = (DATA.chart_annotations || []).map((a) => {
        const i = pts.findIndex((p) => p.week === a.week);
        if (i < 0) return "";
        return `<line x1="${x(i)}" y1="${pad}" x2="${x(i)}" y2="${h - pad}" stroke="#9ca3af" stroke-dasharray="3 3" />
          <text x="${x(i) + 6}" y="${pad + 10}" font-size="11" fill="#6b7280">${a.label}</text>`;
      }).join("");
      return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Credit-Health Index history">${ann}<path d="${d}" fill="none" stroke="#1d4ed8" stroke-width="2.5" />${marks}</svg>`;
    }

    function render() {
      const hs = DATA.health_summary;
      const delta = hs.credit_health_delta;
      const deltaText = delta == null ? "First week on file" : delta === 0 ? "No change from last week" : delta > 0 ? "Up " + delta + " from last week" : "Down " + Math.abs(delta) + " from last week";
      const alerts = DATA.consumer_alerts || [];
      const visible = showAll ? alerts : alerts.slice(0, 3);
      const extra = alerts.length > 3;
      const moves = DATA.next_moves || [];
      const pts = series();
      const title = DATA.is_example_data ? "Credit Weekly: Example Dashboard (Jordan Example)" : "Credit Weekly · " + (DATA.week_label || "");
      const summary = DATA.is_example_data
        ? "A simple weekly look at Jordan Example’s reports. The Credit-Health Index is not a FICO score."
        : "A simple weekly look at your reports. The Credit-Health Index is not a FICO score.";
      const alertGrid = visible.length === 1 ? "grid" : visible.length === 2 ? "grid grid-2" : "grid grid-3";
      const moveGrid = moves.length <= 1 ? "grid" : moves.length === 2 ? "grid grid-2" : "grid grid-3";
      const accounts = (DATA.accounts || []).filter((a) => a.bureau === reportBureau);

      app.innerHTML = `
        <h1>${title}</h1>
        <p class="summary">${summary}</p>

        <section class="section">
          <h2>Your Credit-Health Index</h2>
          <div class="hero">
            <div class="hero-num">${hs.credit_health_index}</div>
            <div class="hero-meta">
              <span class="${toneClass((hs.credit_health_band === "Good" || hs.credit_health_band === "Excellent") ? "success" : "warning")}">${hs.credit_health_band}</span>
              <div style="margin-top:6px">${deltaText}</div>
              <div class="note">Not a FICO score</div>
            </div>
          </div>
          <div class="seg" id="range">
            <button data-r="4w" class="${range === "4w" ? "on" : ""}">4 weeks</button>
            <button data-r="12w" class="${range === "12w" ? "on" : ""}">12 weeks</button>
            <button data-r="all" class="${range === "all" ? "on" : ""}">All</button>
          </div>
          <div class="chart">${spark(pts)}</div>
        </section>

        <section class="section">
          <div class="head-row">
            <div>
              <h2>This week</h2>
              <p class="caption">${alerts.length ? "" : "Nothing new to review."}</p>
            </div>
            ${extra ? `<button class="toggle ${showAll ? "on" : ""}" id="allChanges">See all changes</button>` : ""}
          </div>
          ${visible.length ? `<div class="${alertGrid}">${visible.map((a) => `
            <article class="card"><span class="${toneClass(a.tone)}">${a.status}</span><h3>${a.title}</h3><p>${a.detail}</p></article>
          `).join("")}</div>` : `<p class="empty">Quiet week. No new inquiries, late marks, or surprises.</p>`}
        </section>

        <section class="section">
          <h2>What to do this week</h2>
          <p class="caption">Overall utilization is ${hs.utilization_pct}% · ${DATA.utilization_meter.band_label}</p>
          ${moves.length ? `<div class="${moveGrid}">${moves.map((m) => `
            <article class="card"><span class="${toneClass(m.tone)}">${m.status}</span><h3>${m.title}</h3><p>${m.detail}</p></article>
          `).join("")}</div>` : `<p class="empty">You're in good shape. Keep paying on time and stay in this band.</p>`}
          <div class="meter">
            ${(DATA.utilization_meter.bands || []).map((b) => `
              <div><div class="band ${b.id === DATA.utilization_meter.band_id ? "on" : ""}"></div><div class="lab">${b.label}</div></div>
            `).join("")}
          </div>
        </section>

        <section class="section">
          <h2>Your three bureaus</h2>
          <div class="grid grid-3">
            ${(DATA.bureaus || []).map((b) => `
              <article class="card">
                <h3>${b.label}</h3>
                <dl class="props">
                  <div><dt>Utilization</dt><dd>${b.utilization_pct}%</dd></div>
                  <div><dt>On-time</dt><dd>${b.on_time_pct}%</dd></div>
                  <div><dt>Inquiries</dt><dd>${b.hard_inquiries}</dd></div>
                  <div><dt>Negatives</dt><dd>${b.adverse_count === 0 ? "None" : b.adverse_count}</dd></div>
                  <div><dt>Updated</dt><dd>${b.report_date_display}</dd></div>
                </dl>
              </article>
            `).join("")}
          </div>
        </section>

        <section class="section">
          <div class="head-row">
            <div>
              <h2>See full report</h2>
              <p class="caption">A simple list of the accounts on file.</p>
            </div>
            <button class="toggle ${showReport ? "on" : ""}" id="showReport">${showReport ? "Hide accounts" : "Show accounts"}</button>
          </div>
          ${showReport ? `
            <div class="seg" id="bureauSeg">
              ${(DATA.bureaus || []).map((b) => `<button data-b="${b.bureau}" class="${reportBureau === b.bureau ? "on" : ""}">${b.label}</button>`).join("")}
            </div>
            <table>
              <thead><tr><th>Account</th><th>Balance</th><th>Limit</th><th>Use</th></tr></thead>
              <tbody>
                ${accounts.map((a) => `<tr><td>${a.creditor_display} ${a.masked}</td><td>${a.balance}</td><td>${a.limit}</td><td>${a.util}</td></tr>`).join("")}
              </tbody>
            </table>
          ` : `<p class="empty">Turn this on when you want to look at every account on one bureau.</p>`}
        </section>
      `;

      document.getElementById("range").onclick = (e) => {
        const r = e.target.getAttribute("data-r");
        if (r) { range = r; render(); }
      };
      const allBtn = document.getElementById("allChanges");
      if (allBtn) allBtn.onclick = () => { showAll = !showAll; render(); };
      document.getElementById("showReport").onclick = () => { showReport = !showReport; render(); };
      const bseg = document.getElementById("bureauSeg");
      if (bseg) bseg.onclick = (e) => {
        const b = e.target.getAttribute("data-b");
        if (b) { reportBureau = b; render(); }
      };
    }
    render();
  </script>
</body>
</html>
